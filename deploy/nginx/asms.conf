# RGMCET AIML Academic Schedule Management System (ASMS)
# Nginx Reverse Proxy Configuration for Ubuntu Linux Server

# Upstream Node.js application server
upstream asms_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name asms.rgmcet.edu.in 10.0.0.100 localhost; # Adjust with college domain or server IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asms.rgmcet.edu.in 10.0.0.100 localhost;

    # SSL / TLS Certificate Configuration
    # (Self-signed generated by deployment script or institutional CA / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/asms.crt;
    ssl_certificate_key /etc/ssl/private/asms.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for frontend bundles and responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Maximum payload size (matching timetable CSV batch upload limit)
    client_max_body_size 5M;

    # 3. Realtime Server-Sent Events (SSE) Route
    # Requires proxy_buffering OFF and long timeout to maintain persistent connection
    location /api/timetables/events {
        proxy_pass http://asms_backend/api/timetables/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for real-time delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open (24 hours timeout before automatic client reconnect)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Standard API & Application Routing
    location / {
        proxy_pass http://asms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
